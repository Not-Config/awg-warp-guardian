name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n bootstrap.sh install.sh uninstall.sh src/install-tui.sh src/route-endpoint tests/test_generator_wrapper.sh tests/test_tui_helpers.sh tests/test_route_endpoint.sh
      - name: Check Python syntax
        run: python3 -m compileall -q src tests
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run TUI helper tests
        run: bash tests/test_tui_helpers.sh
      - name: Run generator wrapper tests
        run: bash tests/test_generator_wrapper.sh
      - name: Run endpoint route tests
        run: bash tests/test_route_endpoint.sh
